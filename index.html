<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoboBridge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf3fb;font:15px -apple-system,sans-serif}header,main,footer{max-width:760px;margin:auto;padding:16px}header{background:#14243a}h1{margin:0}p,small,label{color:#9aabc0}section{background:#121d2e;border:1px solid #29384e;border-radius:14px;padding:14px;margin:12px 0}h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#18263a;padding:12px;border-radius:10px}.metric b{display:block;font-size:18px;margin-top:5px}label{display:block;font-size:12px;margin:8px 0 4px}input{width:100%;min-width:65px;background:#0c1727;color:white;border:1px solid #29384e;border-radius:8px;padding:9px;font-size:16px}button{background:#42d392;color:#082015;border:0;border-radius:9px;padding:10px 13px;font-weight:bold;margin:8px 5px 0 0}.secondary{background:#18263a;color:white}.danger{background:#45232b;color:#ffc0c0}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}td,th{padding:6px;border-bottom:1px solid #29384e;text-align:left}th{color:#9aabc0;font-size:12px}.note{font-size:12px;line-height:1.6;color:#9aabc0}</style><header><h1>KoboBridge</h1><p>資産をまとめて、シンプルに見える化。</p></header><main><section><h2>資産サマリー</h2><div class="grid"><div class="metric"><small>総資産（円換算）</small><b id="total">¥0</b></div><div class="metric"><small>目標達成率</small><b id="pct">0%</b></div><div class="metric"><small>米国株</small><b id="stockTotal">¥0</b></div><div class="metric"><small>投資信託</small><b id="fundTotal">¥0</b></div><div class="metric"><small>現金</small><b id="cashTotal">¥0</b></div><div class="metric"><small>目標まで</small><b id="left">¥30,000,000</b></div></div></section><section><h2>設定</h2><div class="grid"><div><label>USD/JPY</label><input id="fx" type="number" step=".01"></div><div><label>目標総資産（円）</label><input id="goal" type="number"></div></div><button onclick="saveSettings()">設定を保存</button></section><section><h2>米国個別株</h2><div class="wrap"><table><thead><tr><th>銘柄</th><th>株数</th><th>取得単価($)</th><th>現在株価($)</th><th>評価額($)</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><button onclick="addStock()">＋銘柄を追加</button><p class="note">株価・為替は手入力。評価額は自動計算。</p></section><section><h2>NISA 投資信託</h2><div class="grid"><div><label>積立元本（円）</label><input id="principal" type="number"></div><div><label>現在評価額（円）</label><input id="fund" type="number"></div></div><button onclick="saveFunds()">保存</button></section><section><h2>現金</h2><div class="grid"><div><label>円現金（円）</label><input id="jpy" type="number"></div><div><label>ドル現金（USD）</label><input id="usd" type="number" step=".01"></div></div><button onclick="saveCash()">保存</button></section><section><h2>データ管理</h2><button onclick="exportJSON()">JSONを書き出す</button><button class="secondary" onclick="document.getElementById('file').click()">JSONを読み込む</button><input id="file" type="file" accept=".json,application/json" hidden onchange="importJSON(event)"><button class="danger" onclick="resetAll()">全データ消去</button><p id="status" class="note">データはこのブラウザ内に保存。自動同期はありません。</p></section></main><footer class="note">個人用資産管理ツールです。投資判断・売買指示は行いません。</footer><script>
const KEY='kobobridge_plain_v1';let d={fx:150,goal:30000000,stocks:[],principal:0,fund:0,jpy:0,usd:0};const el=id=>document.getElementById(id),n=v=>Number(v)||0,fmt=v=>'¥'+Math.round(v).toLocaleString('ja-JP');function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)d={...d,...x,stocks:Array.isArray(x.stocks)?x.stocks:[]}}catch(e){}}function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(msg='保存したよ'){localStorage.setItem(KEY,JSON.stringify(d));el('status').textContent=msg;render()}function render(){el('fx').value=d.fx;el('goal').value=d.goal;el('principal').value=d.principal;el('fund').value=d.fund;el('jpy').value=d.jpy;el('usd').value=d.usd;el('rows').innerHTML=d.stocks.map((s,i)=>`<tr><td><input value="${safe(s.symbol)}" onchange="edit(${i},'symbol',this.value)"></td><td><input type="number" value="${n(s.shares)}" onchange="edit(${i},'shares',this.value)"></td><td><input type="number" step=".01" value="${n(s.cost)}" onchange="edit(${i},'cost',this.value)"></td><td><input type="number" step=".01" value="${n(s.price)}" onchange="edit(${i},'price',this.value)"></td><td>$${(n(s.shares)*n(s.price)).toFixed(2)}</td><td><button class="danger" onclick="removeStock(${i})">削除</button></td></tr>`).join('')||'<tr><td colspan="6">銘柄は未登録です</td></tr>';const st=d.stocks.reduce((a,s)=>a+n(s.shares)*n(s.price),0)*n(d.fx),ft=n(d.fund),ct=n(d.jpy)+n(d.usd)*n(d.fx),total=st+ft+ct,g=n(d.goal)||30000000;el('stockTotal').textContent=fmt(st);el('fundTotal').textContent=fmt(ft);el('cashTotal').textContent=fmt(ct);el('total').textContent=fmt(total);el('pct').textContent=(total/g*100).toFixed(1)+'%';el('left').textContent=fmt(Math.max(0,g-total))}function edit(i,k,v){d.stocks[i][k]=k==='symbol'?v:n(v);save()}function addStock(){d.stocks.push({symbol:'',shares:0,cost:0,price:0});save('銘柄を追加したよ')}function removeStock(i){d.stocks.splice(i,1);save('銘柄を削除したよ')}function saveSettings(){d.fx=n(el('fx').value);d.goal=n(el('goal').value)||30000000;save()}function saveFunds(){d.principal=n(el('principal').value);d.fund=n(el('fund').value);save()}function saveCash(){d.jpy=n(el('jpy').value);d.usd=n(el('usd').value);save()}function exportJSON(){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='KoboBridge-backup.json';a.click();URL.revokeObjectURL(u);el('status').textContent='JSONを書き出したよ'}async function importJSON(e){try{const x=JSON.parse(await e.target.files[0].text());if(!x||!Array.isArray(x.stocks))throw Error();d={...d,...x};save('JSONを読み込んだよ')}catch(err){alert('JSONを読み込めませんでした')}e.target.value=''}function resetAll(){if(confirm('保存データをすべて消去する？')){d={fx:150,goal:30000000,stocks:[],principal:0,fund:0,jpy:0,usd:0};save('全データを消去したよ')}}load();render();
</script></html>
