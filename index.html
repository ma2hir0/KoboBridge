<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>KoboBridge</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--tile:#1a2940;--line:#2a3b53;--text:#edf3fb;--muted:#9aabc0;--accent:#42d392}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{max-width:760px;margin:auto;padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:21px;margin:0}main{max-width:760px;margin:auto;padding:8px 14px 24px}
.sub{color:var(--muted);font-size:12px;margin:4px 0 0}.screen{display:none}.screen.active{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}
.hero{text-align:center;padding:15px 12px}.hero .value{font-size:clamp(28px,8vw,38px);font-weight:800;letter-spacing:-.5px;margin:5px 0}
.progress{height:7px;background:#26364d;border-radius:20px;overflow:hidden;margin-top:9px}.bar{height:100%;background:var(--accent);width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:11px;text-align:left;color:var(--text);width:100%;min-width:0;cursor:pointer}
.tile:active{transform:scale(.985)}.tile .label{display:block;color:var(--muted);font-size:12px}.tile strong{display:block;font-size:clamp(16px,4.5vw,20px);margin-top:5px;overflow-wrap:anywhere}.tile small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.section-title{font-size:14px;color:var(--muted);margin:14px 3px 7px}
button{border:0;border-radius:10px;padding:11px 13px;background:var(--accent);color:#082015;font-weight:750;font-size:14px;cursor:pointer}
button.secondary{background:#26364d;color:var(--text)}button.danger{background:#512a35;color:#ffd3d8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.back{background:#26364d;color:var(--text);padding:8px 11px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}
input{width:100%;background:#0c1727;color:white;border:1px solid var(--line);border-radius:9px;padding:11px;font-size:16px}
.stock-card{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}
.stock-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.stock-name{font-weight:750}.stock-meta{font-size:11px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fields>div{min-width:0}
.note{font-size:11px;color:var(--muted);line-height:1.6}.status{font-size:12px;color:var(--accent);min-height:18px;margin-top:8px}
.empty{color:var(--muted);font-size:12px}.foot{padding:12px 4px;color:var(--muted);font-size:10px;text-align:center}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div><h1>KoboBridge</h1><p class="sub">資産をまとめて、シンプルに見える化。</p></div><span class="sub">個人用</span></header>
<main>
<section id="home" class="screen active">
 <div class="panel hero">
  <div class="sub">総資産（円換算）</div><div class="value" id="total">¥0</div>
  <div class="sub" id="goal-caption">目標 ¥30,000,000</div>
  <div class="progress"><div class="bar" id="progress"></div></div>
  <div class="sub" id="pct">達成率 0%</div>
 </div>
 <div class="section-title">資産内訳・数字をタップして編集</div>
 <div class="grid">
  <button class="tile" onclick="openScreen('stocks')"><span class="label">米国個別株 評価額</span><strong id="stockTotal">¥0</strong><small>保有銘柄・株価を編集 ›</small></button>
  <button class="tile" onclick="openScreen('stocks')"><span class="label">米国個別株 評価損益</span><strong id="stockPL">¥0</strong><small>銘柄別の損益を確認 ›</small></button>
  <button class="tile" onclick="openScreen('funds')"><span class="label">NISA投資信託 評価額</span><strong id="fundTotal">¥0</strong><small>評価額を編集 ›</small></button>
  <button class="tile" onclick="openScreen('funds')"><span class="label">NISA投資信託 積立元本</span><strong id="principal">¥0</strong><small>積立元本を編集 ›</small></button>
  <button class="tile" onclick="openScreen('settings')"><span class="label">目標まで</span><strong id="left">¥0</strong><small>目標金額を編集 ›</small></button>
  <button class="tile" onclick="openScreen('settings')"><span class="label">為替レート</span><strong id="fxView">¥0</strong><small>USD/JPYを編集 ›</small></button>
 </div>
 <div class="actions"><button class="secondary" onclick="exportJSON()">JSONを書き出す</button><button class="secondary" onclick="document.getElementById('file').click()">JSONを読み込む</button><input id="file" type="file" accept=".json,application/json" hidden onchange="importJSON(event)"></div>
 <div class="status" id="status"></div>
 <p class="note">入力内容はこのブラウザ内に自動保存されます。別端末との自動同期はありません。現金は資産合計に含めません。</p>
</section>

<section id="stocks" class="screen">
 <div class="actions"><button class="back" onclick="openScreen('home')">‹ 戻る</button></div>
 <div class="panel"><h2>米国個別株</h2><p class="sub">銘柄ごとに株数・取得単価・現在株価を編集できます。</p><div id="stockList"></div>
 <div class="actions"><button onclick="addStock()">＋銘柄を追加</button><button class="secondary" onclick="saveAndHome()">保存して戻る</button></div>
 <p class="note">入力内容は変更時に自動保存されます。株価自動取得は、KoBoTradeで使用した取得処理の移植が必要なため、この版では未接続です。</p></div>
</section>

<section id="funds" class="screen">
 <div class="actions"><button class="back" onclick="openScreen('home')">‹ 戻る</button></div>
 <div class="panel"><h2>NISA投資信託</h2>
 <label>積立元本（円）</label><input id="principalInput" type="number" inputmode="numeric">
 <label>現在評価額（円）</label><input id="fundInput" type="number" inputmode="numeric">
 <div class="actions"><button onclick="saveFunds()">保存して戻る</button><button class="secondary" onclick="openScreen('home')">キャンセル</button></div>
 </div>
</section>

<section id="settings" class="screen">
 <div class="actions"><button class="back" onclick="openScreen('home')">‹ 戻る</button></div>
 <div class="panel"><h2>目標・為替設定</h2>
 <label>目標総資産（円）</label><input id="goalInput" type="number" inputmode="numeric">
 <label>USD/JPY</label><input id="fxInput" type="number" step=".01" inputmode="decimal">
 <div class="actions"><button onclick="saveSettings()">保存して戻る</button><button class="secondary" onclick="openScreen('home')">キャンセル</button></div>
 </div>
</section>
<footer class="foot">KoboBridge · 個人用資産管理ツール</footer>
</main>
<script>
const KEY='kobobridge_plain_v1';
const seed={fx:158,goal:30000000,stocks:[
{symbol:'AAPL',label:'Apple',shares:6,cost:246,price:0},
{symbol:'AMZN',label:'Amazon',shares:10,cost:229,price:0},
{symbol:'COST',label:'Costco',shares:1,cost:970,price:0},
{symbol:'GOOG',label:'Google',shares:8,cost:283,price:0},
{symbol:'MAR',label:'Marriott',shares:7,cost:285,price:0},
{symbol:'MSFT',label:'Microsoft',shares:8,cost:466,price:0},
{symbol:'PM',label:'PM',shares:12,cost:158,price:0}
],principal:3200000,fund:4264221};
let d={...seed,stocks:seed.stocks.map(x=>({...x}))};
const $=id=>document.getElementById(id),num=v=>Number(v)||0, yen=v=>'¥'+Math.round(v).toLocaleString('ja-JP');
function clean(x){return {fx:num(x.fx)||158,goal:num(x.goal)||30000000,stocks:Array.isArray(x.stocks)?x.stocks.map(s=>({symbol:String(s.symbol||''),label:String(s.label||s.symbol||''),shares:num(s.shares),cost:num(s.cost),price:num(s.price)})):[],principal:num(x.principal),fund:num(x.fund)}}
function load(){try{const x=localStorage.getItem(KEY);if(x)d=clean(JSON.parse(x));}catch(e){}}
function persist(msg='自動保存済み'){localStorage.setItem(KEY,JSON.stringify(d));$('status').textContent=msg;renderHome()}
function renderHome(){
 const stockUsd=d.stocks.reduce((a,s)=>a+s.shares*s.price,0),plUsd=d.stocks.reduce((a,s)=>a+s.shares*(s.price-s.cost),0);
 const st=stockUsd*d.fx,pl=plUsd*d.fx,total=st+d.fund,g=d.goal||30000000,pct=total/g*100;
 $('total').textContent=yen(total);$('goal-caption').textContent='目標 '+yen(g);$('pct').textContent='達成率 '+pct.toFixed(1)+'%';
 $('progress').style.width=Math.max(0,Math.min(100,pct))+'%';$('stockTotal').textContent=yen(st);$('stockPL').textContent=(pl>=0?'+':'−')+yen(Math.abs(pl));$('fundTotal').textContent=yen(d.fund);$('principal').textContent=yen(d.principal);$('left').textContent=yen(Math.max(0,g-total));$('fxView').textContent='¥'+d.fx.toFixed(2);
}
function renderStocks(){
 $('stockList').innerHTML=d.stocks.map((s,i)=>`<div class="stock-card">
 <div class="stock-head"><div><div class="stock-name">${esc(s.label||s.symbol||'新規銘柄')}</div><div class="stock-meta">${esc(s.symbol||'ティッカー未設定')}</div></div><button class="danger" onclick="removeStock(${i})">削除</button></div>
 <div class="fields">
 <div><label>銘柄名</label><input value="${esc(s.label||'')}" oninput="editStock(${i},'label',this.value)"></div>
 <div><label>ティッカー</label><input autocapitalize="characters" value="${esc(s.symbol)}" oninput="editStock(${i},'symbol',this.value.toUpperCase())"></div>
 <div><label>保有株数</label><input type="number" inputmode="decimal" value="${s.shares}" oninput="editStock(${i},'shares',this.value)"></div>
 <div><label>取得単価（USD）</label><input type="number" step=".01" inputmode="decimal" value="${s.cost}" oninput="editStock(${i},'cost',this.value)"></div>
 <div><label>現在株価（USD）</label><input type="number" step=".01" inputmode="decimal" value="${s.price}" oninput="editStock(${i},'price',this.value)"></div>
 <div><label>評価額（USD）</label><input value="${(s.shares*s.price).toFixed(2)}" disabled></div>
 </div></div>`).join('')||'<p class="empty">銘柄はまだ登録されていません。</p>';
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editStock(i,k,v){d.stocks[i][k]=['symbol','label'].includes(k)?v:num(v);localStorage.setItem(KEY,JSON.stringify(d));renderHome();const active=document.activeElement;const y=window.scrollY;}
function addStock(){d.stocks.push({symbol:'',label:'',shares:0,cost:0,price:0});persist('銘柄を追加したよ');renderStocks()}
function removeStock(i){if(confirm('この銘柄を削除する？')){d.stocks.splice(i,1);persist('銘柄を削除したよ');renderStocks()}}
function openScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='stocks')renderStocks();if(id==='funds'){$('principalInput').value=d.principal;$('fundInput').value=d.fund}if(id==='settings'){$('goalInput').value=d.goal;$('fxInput').value=d.fx}window.scrollTo(0,0)}
function saveFunds(){d.principal=num($('principalInput').value);d.fund=num($('fundInput').value);persist('投資信託データを保存したよ');openScreen('home')}
function saveSettings(){d.goal=num($('goalInput').value)||30000000;d.fx=num($('fxInput').value)||158;persist('設定を保存したよ');openScreen('home')}
function saveAndHome(){persist('米国株データを保存したよ');openScreen('home')}
function exportJSON(){const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KoboBridge-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$('status').textContent='JSONを書き出したよ'}
async function importJSON(e){try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.stocks))throw Error();d=clean(x);persist('JSONを読み込んだよ');openScreen('home')}catch(err){alert('JSONを読み込めませんでした')}e.target.value=''}
load();renderHome();
</script>
</body></html>
